<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Castaway Keys">
<meta name="theme-color" content="#03070f">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Castaway Keys Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Night lagoon: notes float in down a torch-lined channel and land on a driftwood keyboard; a hot streak sets the shore on fire */
  --night:#03070f;
  --deep:#0b2234;
  --sea:#13495a;
  --sand:#ecd9aa;
  --torch:#ff8a2a;
  --flame:#ffd04a;
  --ink:#f6efdc;
  --muted:#9fb6c0;
  --display:"Caveat Brush","Marker Felt","Chalkboard SE",cursive;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
[hidden]{display:none !important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- menu ---------- */
#menu{overflow-y:auto;background:
  radial-gradient(ellipse 60% 40% at 50% 108%,#ff8a2a33 0%,transparent 70%),
  radial-gradient(ellipse at 85% -5%,#22466a 0%,transparent 50%),
  linear-gradient(180deg,#03070f 0%,#0b2234 60%,#13495a 100%)}
.menu-inner{width:100%;max-width:820px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(50px,13vw,84px);line-height:.88;margin:0;color:var(--sand);text-wrap:balance;
  text-shadow:0 0 18px #ff8a2a55,0 3px 0 #000a}
.brand h1 span{color:var(--flame);text-shadow:0 0 22px #ff6a1a,0 3px 0 #000a}
.brand p{margin:4px 0 0;color:var(--muted);max-width:54ch;line-height:1.45;font-weight:700}
.microw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cat{display:flex;flex-direction:column;gap:10px}
.cat h2{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--sand);line-height:1}
.cat h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700;margin-left:8px}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.song{display:flex;flex-direction:column;gap:7px;text-align:left;padding:14px 16px 13px;border-radius:12px 16px 13px 15px;border:0;cursor:pointer;color:#fff6e2;
  background:repeating-linear-gradient(176deg,#0000 0 7px,#ffffff08 7px 8px),linear-gradient(180deg,#93714a,#6a4e33);
  box-shadow:inset 0 1px 0 #ffffff33,inset 0 -2px 0 #0003,0 3px 0 #33240f,0 10px 22px #0008;transition:transform .12s}
.song:active{transform:translateY(2px)}
.song .name{font-weight:900;font-size:18px;line-height:1.15;text-shadow:0 1px 0 #0006}
.song .sub{font-size:13px;font-weight:700;color:#f3e2bd;opacity:.85;margin-top:-3px}
.song .meta{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#f1dfb8}
.lvl{padding:2px 8px;border-radius:999px;font-size:12px}
.l1{background:#2f8f6a}.l2{background:#c47a1d}.l3{background:#b23d4a}
.best{margin-left:auto;display:flex;gap:6px;align-items:center}
.stars{color:#ffd36b;letter-spacing:1px;font-size:15px}

/* ---------- chips ---------- */
.chip{border:1px solid #ffffff2a;background:#ffffff12;border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;line-height:1.1}
.chip.primary{background:linear-gradient(180deg,#ffb04a,#ff7a1a);color:#2b1405;border-color:transparent;box-shadow:0 0 16px #ff7a1a55}
.chip.toggle[aria-pressed="true"]{background:var(--sand);color:#2a1d10;border-color:transparent}
.chip.toggle[aria-pressed="true"]::before{content:"✓ "}
.chip.mic[data-on="true"]{background:#163d2e;border-color:#3fd18a;color:#bff5d8}
.chip.big{font-size:16px;padding:10px 18px}

/* ---------- play ---------- */
#play{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.bar{display:flex;flex-direction:column;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:linear-gradient(180deg,#02050b,#050c18);border-bottom:1px solid #ffffff14;position:relative;z-index:2}
.row1{display:flex;align-items:center;gap:10px;min-width:0}
.row1 h2{flex:1;min-width:0;font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1;color:var(--sand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.speed{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;padding-left:4px}
.speed input{width:96px;accent-color:var(--torch)}
.speed output{min-width:3.2em;font-variant-numeric:tabular-nums;color:var(--sand)}
#stage{position:relative;flex:1;min-height:0;background:#03070f}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:none}
.card{pointer-events:auto;width:100%;max-width:400px;max-height:100%;overflow-y:auto;padding:18px 18px 16px;border-radius:16px;background:#050e1ce8;border:1px solid #ffffff22;
  box-shadow:0 0 0 1px #000,0 18px 50px #000c,inset 0 1px 0 #ffffff14;display:flex;flex-direction:column;gap:9px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--sand);text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.45;color:var(--muted);font-weight:700}
.card .meta{color:var(--ink)}
.card .actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.bigstars{font-size:36px;color:#ffd36b;letter-spacing:4px;line-height:1;text-shadow:0 0 16px #ffb02a88}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:#ffffff0c;border:1px solid #ffffff14;border-radius:10px;padding:7px 6px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fb{display:flex;flex-direction:column;gap:6px}
.fb div{font-size:14px;line-height:1.4;font-weight:700;color:var(--ink);padding:8px 10px;border-radius:10px;background:#ffffff0a;border-left:3px solid var(--torch)}
.fb div.good{border-left-color:#3fd18a}
.scoreline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.scoreline b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--flame);text-shadow:0 0 14px #ff7a1a88}
.scoreline span{font-weight:800;color:var(--muted);font-size:14px}

/* ---------- mic setup ---------- */
.modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:#000b}
.sheet{width:100%;max-width:420px;max-height:100%;overflow-y:auto;padding:20px;border-radius:18px;background:linear-gradient(180deg,#0a1a2c,#06101e);border:1px solid #ffffff22;box-shadow:0 20px 60px #000;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--sand)}
.sheet p{margin:0;color:var(--muted);font-weight:700;line-height:1.45;font-size:15px}
.sheet p strong{color:var(--ink)}
.listen{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;background:#ffffff0a;border:1px solid #ffffff14}
.heard{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-size:30px;font-weight:900;background:#ffffff10;color:var(--ink);flex:none;transition:background .15s}
.levelwrap{flex:1;display:flex;flex-direction:column;gap:6px}
.level{height:10px;border-radius:99px;background:#ffffff14;overflow:hidden;position:relative}
.level i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#3fd18a,#ffd04a,#ff6a1a);border-radius:99px}
.level em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.8}
.levelwrap small{color:var(--muted);font-weight:700;font-size:12px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:5px;border-radius:9px;background:#ffffff1a}
.steps span.on{background:var(--torch);box-shadow:0 0 8px var(--torch)}
.field{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:13px;color:var(--muted)}
.field input{accent-color:var(--torch)}
.field output{color:var(--sand);font-variant-numeric:tabular-nums}
.adv{display:grid;gap:10px;padding-top:4px;border-top:1px solid #ffffff14}

@media (max-height:520px){
  .bar{flex-direction:row;align-items:center;flex-wrap:wrap;padding:max(6px,env(safe-area-inset-top)) 10px 6px;gap:6px 10px}
  .row1 h2{font-size:21px;flex:none;max-width:30vw}
  .chip{padding:5px 10px;font-size:13px}
  .card{padding:12px 14px;gap:6px}
  .card h3{font-size:26px}
  .stats{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){.song{transition:none}}
</style>
</head>
<body>

<!-- ================= MENU ================= -->
<section id="menu" class="screen">
  <div class="menu-inner">
    <header class="brand">
      <h1>Castaway Keys <span>Live</span></h1>
      <p>Play your real piano. The island listens, scores every note, and sets the shore on fire when you get a streak going.</p>
    </header>
    <div class="microw">
      <button id="menuMic" class="chip mic big" type="button" data-on="false">🎤 Set up listening</button>
      <span id="menuMicNote" style="color:var(--muted);font-weight:700;font-size:14px"></span>
    </div>
    <div id="cats"></div>
  </div>
</section>

<!-- ================= PLAY ================= -->
<section id="play" class="screen" hidden>
  <header class="bar">
    <div class="row1">
      <button id="backBtn" class="chip" type="button">← Songs</button>
      <h2 id="songTitle"></h2>
      <button id="micBtn" class="chip mic" type="button" data-on="false">🎤 Off</button>
    </div>
    <div class="row2">
      <button id="startBtn" class="chip primary" type="button">▶ Play</button>
      <button id="restartBtn" class="chip" type="button">↺</button>
      <button id="waitBtn" class="chip toggle" type="button" aria-pressed="false">Wait for me</button>
      <button id="demoBtn" class="chip" type="button">♪ Hear it</button>
      <label class="speed" for="speed">Speed <input id="speed" type="range" min="40" max="130" step="5" value="70"><output id="speedVal" for="speed">70%</output></label>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv" aria-label="Notes floating toward a 2-octave keyboard"></canvas>
    <div id="intro" class="overlay">
      <div class="card">
        <h3 id="introTitle"></h3>
        <p class="meta" id="introMeta"></p>
        <p id="introTip"></p>
        <div class="actions">
          <button id="introStart" class="chip primary big" type="button">▶ Play</button>
          <button id="introDemo" class="chip big" type="button">♪ Hear it first</button>
        </div>
      </div>
    </div>
    <div id="results" class="overlay" hidden>
      <div class="card" id="resCard"></div>
    </div>
  </div>
</section>

<!-- ================= MIC SETUP ================= -->
<div id="setup" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h3 id="setupTitle">Let the island hear you</h3>
    <div class="steps" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <p id="setupMsg"></p>
    <div class="listen">
      <div class="heard" id="setupHeard">–</div>
      <div class="levelwrap">
        <div class="level"><i id="setupLevel"></i><em id="setupGate"></em></div>
        <small id="setupSmall">Mic level. Notes need to pass the white line. It moves with the room's background noise.</small>
      </div>
    </div>
    <div class="actions" style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="setupGo" class="chip primary big" type="button">Allow microphone</button>
      <button id="setupSkip" class="chip big" type="button" hidden>Skip tuning</button>
      <button id="setupClose" class="chip big" type="button">Close</button>
    </div>
    <div class="adv" id="setupAdv" hidden>
      <label class="field" for="sens">Sensitivity <output id="sensVal"></output>
        <input id="sens" type="range" min="0" max="100" step="1"></label>
      <label class="field" for="lat">Mic delay correction <output id="latVal"></output>
        <input id="lat" type="range" min="0" max="250" step="10"></label>
      <button id="setupRetune" class="chip" type="button">Re-tune piano</button>
    </div>
  </div>
</div>

<script>

const CATS = [
  {id:'starter', name:'Island classics', note:'start here'},
  {id:'bangers', name:'Bangers', note:'harder, way more fun'},
  {id:'weird', name:'Weird ones', note:'spooky, salty, sassy'}
];

const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BASE = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const COLORS = {C:'#e8433a',D:'#f2672e',E:'#f7a02b',F:'#f4cb2f',G:'#2f8fd8',A:'#d8437e',B:'#6b46b8'};
const WHITES = [60,62,64,65,67,69,71,72,74,76,77,79,81,83,84];
const BLACKS = [61,63,66,68,70,73,75,78,80,82];
const pcOf = m => ((Math.round(m) % 12) + 12) % 12;
const isBlack = m => [1,3,6,8,10].includes(pcOf(m));
const letterOf = m => NAMES[pcOf(m)];
const colorOf = m => COLORS[NAMES[pcOf(m)][0]];
const labelOf = m => letterOf(m) + (m >= 84 ? "''" : m >= 72 ? "'" : "");
const darkText = m => ['F','E'].includes(letterOf(m));

function parse(score){
  const notes = []; let t = 0, bar = 1;
  for (const tok of score.trim().split(/\s+/)){
    if (tok === '|'){ bar++; continue; }
    const m = tok.match(/^([A-GR])(#|b)?('*)(?::([\d.]+))?$/);
    if (!m) continue;
    const d = m[4] ? parseFloat(m[4]) : 1;
    if (m[1] !== 'R'){
      const midi = 60 + BASE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12 * m[3].length;
      notes.push({midi, start:t, dur:d, bar});
    }
    t += d;
  }
  return {notes, bars:bar};
}

/* ---------- storage ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('ckl:' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('ckl:' + k, JSON.stringify(v)); } catch(e){} }
};
const cfg = Object.assign({wait:false, input:'tap', tempo:0.7, latency:90, sens:85, boost:true, offset:0, tuned:false, v:2}, store.get('cfg', {}));
if (cfg.v !== 2){ cfg.sens = 85; cfg.boost = true; cfg.v = 2; }
const saveCfg = () => store.set('cfg', cfg);

/* =====================================================================
   AUDIO OUT
   ===================================================================== */
let ac = null, master = null, noiseBuf = null;
function ensureAudio(){
  try { if (navigator.audioSession && !Mic.on) navigator.audioSession.type = 'playback'; } catch(e){}
  try {
    if (!ac){
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain(); master.gain.value = 0.6;
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch(e){}
}
function quietForMic(sec){ if (Mic.on) Mic.ignoreUntil = Math.max(Mic.ignoreUntil, performance.now() + sec * 1000 + 250); }
function playTone(midi, durSec){
  if (!ac) return;
  const f = 440 * Math.pow(2, (midi - 69) / 12), now = ac.currentTime;
  const hold = clamp(durSec, 0.25, 1.6);
  const g = ac.createGain(), lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.setValueAtTime(f * 8, now); lp.frequency.exponentialRampToValueAtTime(f * 2.5, now + hold);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.5, now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.16, now + 0.25);
  g.gain.exponentialRampToValueAtTime(0.0008, now + hold + 0.45);
  const o1 = ac.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.005;
  const o3 = ac.createOscillator(); o3.type = 'sine'; o3.frequency.value = f * 0.999;
  const g2 = ac.createGain(); g2.gain.value = 0.22;
  o1.connect(lp); o3.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(master);
  [o1,o2,o3].forEach(o => { o.start(now); o.stop(now + hold + 0.5); });
  quietForMic(hold);
}
function sfxNoise(dur, f0, f1, vol, q){
  if (!ac || (Mic.on && cfg.input === 'mic')) return;
  const now = ac.currentTime, src = ac.createBufferSource(); src.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q || 0.8;
  bp.frequency.setValueAtTime(f0, now); bp.frequency.exponentialRampToValueAtTime(f1, now + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + dur * 0.25); g.gain.exponentialRampToValueAtTime(0.0005, now + dur);
  src.connect(bp); bp.connect(g); g.connect(master); src.start(now); src.stop(now + dur + 0.05);
}
function sfxIgnite(){
  sfxNoise(0.9, 250, 3200, 0.7, 0.6);
  if (!ac || (Mic.on && cfg.input === 'mic')) return;
  const now = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(110, now); o.frequency.exponentialRampToValueAtTime(38, now + 0.5);
  g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.7, now + 0.02); g.gain.exponentialRampToValueAtTime(0.0005, now + 0.55);
  o.connect(g); g.connect(master); o.start(now); o.stop(now + 0.6);
}
const sfxFizz = () => sfxNoise(0.6, 4000, 700, 0.3, 1.2);
const sfxTorch = () => sfxNoise(0.25, 500, 1800, 0.18, 1);

/* =====================================================================
   MIC + PITCH DETECTION (YIN)
   ===================================================================== */
const Mic = {
  on:false, stream:null, an:null, buf:null, sr:48000, d:null, c:null,
  level:0, rms:0, gate:0.015, hist:[], lastOnset:0, pending:null, cand:null, frame:0,
  lastMidi:null, ignoreUntil:0, heard:null, heardAt:0, onNote:null,
  async start(){
    if (this.on) return true;
    if (!window.isSecureContext) throw new Error('insecure');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
    ensureAudio();
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch(e){}
    // Boost (auto gain) lets the phone raise quiet, far-away sound; echo cancel / noise suppression stay off because they eat music.
    this.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:cfg.boost !== false}});
    ensureAudio();
    const src = ac.createMediaStreamSource(this.stream);
    // band-pass to the piano's range so room rumble and hiss don't drown out distant notes
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 180; hp.Q.value = 0.7;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 0.7;
    this.pre = ac.createGain(); this.pre.gain.value = 4;
    this.an = ac.createAnalyser(); this.an.fftSize = 2048; this.an.smoothingTimeConstant = 0;
    src.connect(hp); hp.connect(lp); lp.connect(this.pre); this.pre.connect(this.an);
    this.sr = ac.sampleRate; this.buf = new Float32Array(2048);
    const tauMax = Math.min(Math.floor(this.sr / 70), 2048 - this.W - 2);
    this.d = new Float32Array(tauMax + 2); this.c = new Float32Array(tauMax + 2);
    this.floor = 0; this.hist = []; this.mins = []; this.blk = null; this.pending = null; this.cand = null;
    this.ring = new Float32Array(8192); this.ringN = 0; this.hop = 0; this.lastSus = 0; this.lastT = 0;
    // Listen on the audio thread: every sample reaches the detector even when the fire graphics slow the screen down.
    this.useWorklet = false;
    try {
      if (ac.audioWorklet && window.AudioWorkletNode){
        if (!Mic.wl){
          const code = "class T extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(512);this.n=0;}" +
            "process(i){const c=i[0]&&i[0][0];if(c){for(let k=0;k<c.length;k++){this.b[this.n++]=c[k];if(this.n===512){" +
            "this.port.postMessage({b:this.b,t:currentTime+k/sampleRate},[this.b.buffer]);this.b=new Float32Array(512);this.n=0;}}}return true;}}" +
            "registerProcessor('ck-tap',T);";
          await ac.audioWorklet.addModule(URL.createObjectURL(new Blob([code], {type:'application/javascript'})));
          Mic.wl = true;
        }
        this.node = new AudioWorkletNode(ac, 'ck-tap', {numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[1]});
        this.mute = ac.createGain(); this.mute.gain.value = 0;
        this.pre.connect(this.node); this.node.connect(this.mute); this.mute.connect(ac.destination);
        this.node.port.onmessage = e => this.feed(e.data.b, e.data.t);
        this.useWorklet = true;
      }
    } catch(e){ this.useWorklet = false; }
    this.on = true;
    return true;
  },
  async restart(){ this.stop(); return this.start(); },
  stop(){
    try { this.stream && this.stream.getTracks().forEach(t => t.stop()); } catch(e){}
    try { if (this.node){ this.node.port.onmessage = null; this.node.disconnect(); } } catch(e){}
    this.on = false; this.stream = null; this.an = null; this.node = null;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  },
  W: 800,
  // YIN pitch detection on the NEWEST audio in the buffer (older versions read slightly stale audio,
  // which could still contain the previous note when you play notes back to back)
  yin(){
    const buf = this.buf, sr = this.sr, W = this.W, d = this.d, c = this.c;
    const tauMax = d.length - 2, tauMin = Math.max(2, Math.floor(sr / 2200)), o = buf.length - W - tauMax - 1;
    for (let tau = 1; tau <= tauMax; tau++){
      let s = 0;
      for (let j = 0; j < W; j++){ const v = buf[o + j] - buf[o + j + tau]; s += v * v; }
      d[tau] = s;
    }
    let run = 0; c[0] = 1;
    for (let tau = 1; tau <= tauMax; tau++){ run += d[tau]; c[tau] = run > 0 ? d[tau] * tau / run : 1; }
    let tau = -1;
    for (let t = tauMin; t < tauMax; t++){
      if (c[t] < 0.22){ while (t + 1 < tauMax && c[t + 1] < c[t]) t++; tau = t; break; }
    }
    if (tau < 0) return null;
    const x0 = c[tau - 1], x1 = c[tau], x2 = c[tau + 1], den = 2 * (2 * x1 - x2 - x0);
    const bt = Math.abs(den) > 1e-9 ? tau + (x2 - x0) / den : tau;
    return {f: sr / bt, conf: 1 - x1};
  },
  emit(m, t0, conf){
    this.lastMidi = m; this.heard = m; this.heardAt = performance.now();
    if (this.onNote) this.onNote(m, t0, conf == null ? 0.9 : conf);
  },
  // audio-thread path: 512-sample chunks arrive with their audio-clock time
  feed(b, tEnd){
    if (!this.on) return;
    let off = null;
    try { const ts = ac.getOutputTimestamp && ac.getOutputTimestamp(); if (ts && ts.performanceTime) off = ts.performanceTime - ts.contextTime * 1000; } catch(e){}
    if (off == null) off = performance.now() - ac.currentTime * 1000;
    const R = this.ring, L = R.length, sr = this.sr, t0 = tEnd - (b.length - 1) / sr;
    for (let i = 0; i < b.length; i++){
      R[this.ringN % L] = b[i]; this.ringN++;
      if (++this.hop >= 256 && this.ringN >= 2048){
        this.hop = 0;
        const N = this.ringN;
        for (let k = 0; k < 2048; k++) this.buf[k] = R[(N - 2048 + k) % L];
        this.analyze((t0 + i / sr) * 1000 + off, 1024);
      }
    }
  },
  // fallback path for browsers without AudioWorklet
  tick(now){
    if (!this.on || !this.an || this.useWorklet) return;
    this.an.getFloatTimeDomainData(this.buf);
    this.analyze(now, 2048);
  },
  analyze(now, rmsLen){
    const b = this.buf;
    let s = 0;
    for (let i = b.length - rmsLen; i < b.length; i++) s += b[i] * b[i];
    const rms = Math.sqrt(s / rmsLen);
    const dtMs = this.lastT ? clamp(now - this.lastT, 1, 100) : 16; this.lastT = now;
    this.rms = rms; this.level = Math.max(rms, this.level * Math.pow(0.88, dtMs / 16));
    // Background level = the quietest 100 ms stretch in the last 3 seconds (doesn't creep up while you keep playing)
    if (!this.blk || now - this.blk.t0 > 100){
      if (this.blk){ this.mins.push(this.blk.min); if (this.mins.length > 30) this.mins.shift(); }
      this.blk = {t0:now, min:rms};
    } else if (rms < this.blk.min) this.blk.min = rms;
    this.floor = Math.max(0.0002, this.mins.length ? Math.min(this.blk.min, Math.min.apply(null, this.mins)) : rms);
    // gate sits just above the background; higher sensitivity = closer to it
    const sens = clamp(cfg.sens, 0, 100) / 100;
    let gate = Math.max(0.0006, this.floor * lerp(4, 1.4, sens));
    // and never asks for more than a small slice of how loud your piano was during tuning
    if (cfg.notePeak) gate = Math.min(gate, Math.max(cfg.notePeak * lerp(0.15, 0.04, sens), this.floor * 1.3));
    this.gate = gate;
    const quiet = now < this.ignoreUntil;
    // Attack detection. After a note starts we wait for it to peak and begin fading ("armed"),
    // then a new note = a jump of 25% above the lowest point since. One key press = one note.
    if (this.armed === undefined){ this.armed = true; this.valley = rms; this.peak = 0; }
    if (!this.armed){
      if (rms > this.peak) this.peak = rms;
      if (rms < this.peak * 0.82 || rms < gate || now - this.lastOnset > 400){ this.armed = true; this.valley = rms; }
    } else if (rms < this.valley) this.valley = rms;
    if (!quiet && !this.pending && this.armed && rms > gate && rms > this.valley * 1.25 + this.floor * 0.25 && now - this.lastOnset > 70){
      this.pending = {t0:now, f:[], c:[]}; this.lastOnset = now; this.cand = null;
      this.armed = false; this.peak = rms;
    }
    if (this.pending){
      const p = this.pending, age = now - p.t0;
      // wait ~30 ms so the analysis window is mostly the new note, then take up to 3 readings
      if (age >= 30 && (!p.last || now - p.last >= 9)){
        p.last = now;
        const r = this.yin();
        if (r && r.conf > 0.68 && r.f > 70 && r.f < 2200){ p.f.push(r.f); p.c.push(r.conf); }
      }
      if (p.f.length >= 3 || (p.f.length >= 2 && age > 80) || (p.f.length === 1 && p.c[0] > 0.85 && age > 110) || age > 180){
        if (p.f.length){
          const idx = p.f.map((f, i) => i).sort((a, c) => p.f[a] - p.f[c])[Math.floor(p.f.length / 2)];
          this.emit(69 + 12 * Math.log2(p.f[idx] / 440), p.t0, Math.max.apply(null, p.c));
        }
        this.pending = null;
      }
    } else if (!quiet && rms > gate * 1.3 && now - this.lastSus > 30){
      // a new pitch while the sound keeps going (no clear attack)
      this.lastSus = now;
      const r = this.yin();
      if (r && r.conf > 0.88 && r.f > 70 && r.f < 2200){
        const m = 69 + 12 * Math.log2(r.f / 440);
        const diff = this.lastMidi == null ? 99 : Math.abs(m - this.lastMidi);
        if (diff > 0.7 && Math.abs(diff - 12) > 0.7 && Math.abs(diff - 24) > 0.7){
          if (this.cand && Math.abs(this.cand.m - m) < 0.5){ this.cand.n++; }
          else this.cand = {m, n:1, t:now};
          if (this.cand.n >= 2){ const c = this.cand; this.cand = null; this.emit(c.m, c.t - 40); }
        } else this.cand = null;
      }
    }
  }
};

const menu = $('menu'), play = $('play'), stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const intro = $('intro'), results = $('results');
const startBtn = $('startBtn'), waitBtn = $('waitBtn'), speed = $('speed'), speedVal = $('speedVal'), micBtn = $('micBtn');
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function syncControls(){

/* =====================================================================
   GAME STATE
   ===================================================================== */
const LEAD = 4;
let state = null;
const keyFx = new Map();
const fx = m => { if (!keyFx.has(m)) keyFx.set(m, {down:false, press:-1e9, wrong:-1e9, hit:-1e9}); return keyFx.get(m); };
const bps = () => state.song.bpm * cfg.tempo / 60;
const winBeats = () => clamp(0.3 * bps(), 0.25, 0.5);

function newState(idx, section){
  const song = SONGS[idx];
  const parsed = parse(song.score);
  let notes = parsed.notes.map(n => Object.assign({}, n, {judged:null, played:false, wrongs:0}));
  if (section){
    notes = notes.filter(n => n.bar >= section.from && n.bar <= section.to);
    const shift = notes.length ? notes[0].start : 0;
    notes.forEach(n => n.start -= shift);
  }
  return {
    idx, song, notes, bars:parsed.bars, section:section || null, pass:1,
    t: -(section ? 2 : LEAD), lead: section ? 2 : LEAD,
    running:false, started:false, finished:false, demo:false, ni:0, waiting:false,
    end: notes.length ? Math.max(...notes.map(n => n.start + n.dur)) : 0,
    score:0, shown:0, streak:0, maxStreak:0, mult:1, fire:false, fireNotes:0,
    counts:{perfect:0, good:0, ok:0, miss:0, wrong:0}, deltas:[], conf:{}, barErr:{},
    passHits:0, passErr:0
  };
}
function openSong(idx, section){
  const old = state;
  state = newState(idx, section);
  if (old && old.idx === idx && section && old.section){ state.score = old.score; state.streak = old.streak; state.fire = old.fire; }
  resetFx();
  $('songTitle').textContent = SONGS[idx].name + (section ? ` · bars ${section.from}–${section.to}` : '');
  $('introTitle').textContent = section ? `Practice bars ${section.from}–${section.to}` : SONGS[idx].name;
  const keys = [...new Set(state.notes.map(n => n.midi))].sort((a,b) => a - b).map(labelOf);
  $('introMeta').textContent = `${state.notes.length} notes · keys: ${keys.join(' ')}`;
  const listening = Mic.on && cfg.input === 'mic';
  $('introTip').textContent = section
    ? 'This part loops. Get it clean and the speed goes up 5% each time.'
    : listening
      ? (cfg.wait ? 'Each note waits until it hears you play it. No rush.' : 'Play each note on your piano as it lands. Hit 10 in a row to catch fire.')
      : 'Tap the keys below as notes land, or turn on 🎤 to play your real piano. Hit 10 in a row to catch fire.';
  menu.hidden = true; play.hidden = false; results.hidden = true; intro.hidden = false;
  updateStartBtn();
  requestAnimationFrame(layout);
}
function resetFx(){ keyFx.clear(); P.length = 0; popups.length = 0; torches.forEach(t => { t.lit = false; t.lv = 0; }); fireLv = 0; }
function reset(autoStart){
  if (!state) return;
  const {idx, section} = state;
  state = null; openSong(idx, section);
  if (autoStart) begin(false);
}
function begin(demo){
  ensureAudio();
  const s = state; if (!s) return;
  if (s.started){ const {idx, section} = s; state = null; openSong(idx, section); }
  state.demo = !!demo; state.started = true; state.running = true;
  intro.hidden = true; results.hidden = true;
  if (!demo && cfg.input === 'mic' && cfg.tuned && !Mic.on) Mic.start().then(syncControls).catch(() => {});
  updateStartBtn();
}
function updateStartBtn(){
  const s = state; let t = '▶ Play';
  if (s && s.finished) t = '▶ Again';
  else if (s && s.running) t = '❚❚ Pause';
  else if (s && s.started) t = '▶ Resume';
  startBtn.textContent = t;
}
function toggleRun(){
  ensureAudio();
  const s = state; if (!s) return;
  if (s.finished || (s.started && s.demo && !s.running)){ reset(true); return; }
  if (!s.started){ begin(false); return; }
  s.running = !s.running; updateStartBtn();
}

function update(dt){
  const s = state; if (!s || !s.running || s.finished) return;
  const B = bps();
  let nt = s.t + dt * B;
  if (s.demo){
    s.t = nt;
    for (const n of s.notes){
      if (n.start > s.t) break;
      if (!n.played){ n.played = true; playTone(n.midi, n.dur / B); fx(n.midi).press = performance.now(); }
    }
    if (s.t >= s.end + 0.6) finishDemo();
    return;
  }
  if (cfg.wait){
    const n = s.notes[s.ni];
    if (n && nt >= n.start){ nt = n.start; s.waiting = true; } else s.waiting = false;
    s.t = nt;
    if (!n && s.t >= s.end + 0.4) finishPass();
  } else {
    s.t = nt;
    const W = winBeats();
    for (const n of s.notes){
      if (n.start > s.t) break;
      if (!n.judged && s.t > n.start + W) missNote(n);
    }
    if (s.t >= s.end + 1) finishPass();
  }
}

/* ---------- judging ---------- */
function played(p){
  const s = state;
  if (!s || !s.running || s.finished || s.demo) return;
  if (cfg.wait){
    if (s.t < -0.4) return;
    const n = s.notes[s.ni]; if (!n) return;
    if (n.start - s.t > 1.5) return;
    if (p.pc === pcOf(n.midi)){
      hitNote(n, null, p); s.ni++;
      if (s.t < n.start) s.t = n.start;
      s.waiting = false;
    } else if (p.src !== 'mic' || p.conf >= 0.86) wrongNote(n, p);
    return;
  }
  const B = bps(), W = winBeats();
  const tAt = s.t - (performance.now() - p.when) / 1000 * B;
  let best = null, bd = 1e9;
  for (const n of s.notes){
    if (n.start - tAt > W) break;
    if (n.judged) continue;
    const dd = Math.abs(n.start - tAt);
    if (dd <= W && pcOf(n.midi) === p.pc && dd < bd){ best = n; bd = dd; }
  }
  if (best){ hitNote(best, (tAt - best.start) / B, p); return; }
  const near = s.notes.find(n => !n.judged && Math.abs(n.start - tAt) <= W);

}
function hitNote(n, dSec, p){
  const s = state;
  n.judged = 'hit';
  let grade, pts, tag = '';
  if (dSec == null){ grade = n.wrongs ? 'good' : 'perfect'; pts = n.wrongs ? 60 : 100; }
  else {
    const a = Math.abs(dSec);
    grade = a <= 0.08 ? 'perfect' : a <= 0.17 ? 'good' : 'ok';
    pts = grade === 'perfect' ? 100 : grade === 'good' ? 70 : 40;
    if (a > 0.06) tag = dSec < 0 ? 'early' : 'late';
    s.deltas.push(dSec);
  }
  n.grade = grade;
  s.counts[grade]++; s.passHits++;
  s.streak++; s.maxStreak = Math.max(s.maxStreak, s.streak);
  const wasFire = s.fire;
  s.mult = s.streak >= 40 ? 4 : s.streak >= 25 ? 3 : s.streak >= 10 ? 2 : 1;
  s.score += pts * s.mult;
  if (s.streak >= 10 && !wasFire) ignite();
  if (s.fire) s.fireNotes++;
  if (s.streak > 0 && s.streak < 10 && s.streak % 2 === 0) sfxTorch();
  const f = fx(n.midi); f.hit = performance.now();
  burst(n, grade);
  const k = keyX(n.midi);
  const label = grade === 'perfect' ? (s.fire ? 'BLAZING!' : 'Perfect!') : grade === 'good' ? 'Good' : 'OK';
  addPopup(label, tag, k.x + k.w / 2, G.hitY - G.W * 1.2, grade === 'perfect' ? (s.fire ? '#ffd04a' : '#ffffff') : grade === 'good' ? '#bff5d8' : '#9fb6c0', grade === 'perfect' ? 1 : 0.8);
  if (s.streak === 25 || s.streak === 40) addPopup(`×${s.mult}`, `${s.streak} in a row`, cw / 2, G.hitY * 0.5, '#ffd04a', 2);
}
function wrongNote(n, p){
  const s = state;
  s.counts.wrong++; s.passErr++; n.wrongs++;
  s.barErr[n.bar] = (s.barErr[n.bar] || 0) + 1;
  const key = NAMES[p.pc] + '>' + letterOf(n.midi);
  s.conf[key] = (s.conf[key] || 0) + 1;
  breakStreak();
  let m = p.midi;
  if (m == null || m < 60 || m > 84 || pcOf(m) !== p.pc){
    m = n.midi - ((pcOf(n.midi) - p.pc + 12) % 12); if (m < 60) m += 12; if (n.midi - m > 6 && m + 12 <= 84) m += 12;
  }
  fx(m).wrong = performance.now();
  const k = keyX(n.midi);
  addPopup('Wrong note', `you played ${NAMES[p.pc]} · need ${letterOf(n.midi)}`, clamp(k.x + k.w / 2, 90, cw - 90), G.hitY - G.W * 1.5, '#ff6a5a', 0.95);
}
function missNote(n){
  const s = state;

  breakStreak();

  addPopup('Miss', '', k.x + k.w / 2, G.hitY - G.W * 1.1, '#7f93a0', 0.7);
}
function breakStreak(){
